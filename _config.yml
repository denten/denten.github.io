# Dependencies

# kramdown to support footnotes
markdown:         kramdown
highlighter:      rouge

# Permalinks
permalink:        /:categories/:title

# Setup
title:            Dennis Yi Tenen
tagline:          ''
description:      'Dennis Yi Tenen is a Professor of English and Comparative Literature at Columbia University and the author of Literary Theory for Robots.'
url:              https://dennistenen.com
image:            /public/denten-profile-bw.jpeg

# Collections
collections_dir: collections
collections:
  books:
    output: true

# Required if you want to move pages into a separate directory
include: ['_pages']
relative_permalinks: false

author:
  name:           'Dennis Yi Tenen'
  url:            https://twitter.com/dennistenen

# number of posts on each page
# paginate:         3

# Custom vars

github:
  repo:           https://github.com/denten/denten.github.io

# Main menu, in this order
nav:
  - title: About
    url: /
  - title: Books
    url: /books/
  - title: Publications
    url: /publications/
  - title: Talks
    url: /talks/
  - title: Teaching
    url: /teaching/
  - title: Notes
    url: /notes/
