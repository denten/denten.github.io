---
layout: default
---

{{ content }}

<ul class="book-list">
  {%- for book in site.books %}
  <li>
    <a href="{{ book.url }}">
      <img src="{{ book.cover }}" alt="Cover of {{ book.title }}" loading="lazy">
      <span>
        <span class="title">{{ book.title }}</span>
        {%- if book.subtitle %}
        <span class="subtitle">{{ book.subtitle }}</span>
        {%- endif %}
        <span class="pub">{{ book.publisher }}, {{ book.year }}</span>
      </span>
    </a>
  </li>
  {%- endfor %}
</ul>
