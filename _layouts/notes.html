---
layout: default
---

<div class="intro">
{{ content }}
</div>

<ul class="post-list">
  {%- for post in site.posts %}
  <li>
    <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y" }}</time>
    <span>
      <a href="{{ post.url }}">{{ post.title }}</a>
      {%- if post.subtitle %}<span class="sub">{{ post.subtitle }}</span>{% endif %}
    </span>
  </li>
  {%- endfor %}
</ul>
