---
layout: default
---

<article>
  <header class="post-header">
    {%- if page.title %}
    <h1>{{ page.title }}</h1>
    {%- endif %}
    {%- if page.subtitle %}
    <p class="sub">{{ page.subtitle }}</p>
    {%- endif %}
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  <div class="prose">
{{ content }}
  </div>
</article>
